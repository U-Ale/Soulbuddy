<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Contato</title>

    <link rel="stylesheet" href="css/style.css">

</head>
<body>

    <!-- NAVBAR -->

    <header>

        <nav class="navbar">

            <h1 class="logo">
                EcoFuture
            </h1>

            <ul class="menu">

                <li>
                    <a href="index.html">
                        Início
                    </a>
                </li>

                <li>
                    <a href="sobre.html">
                        Sobre

                </li>

                <li>

                <li>

                <li>
                    <a href="contato.html">
                        Contato
                    </a>
                </li>

            </ul>

        </nav>

    </header>

    <!-- CONTATO -->

    <section class="contato">

        <div class="contato-card card">

            <h2>
                Entre em Contato
            </h2>

            <p>
                Envie uma mensagem para nossa equipe.
            </p>
            <div class="email-info">

    📧 contato@ecofuture.com

</div>

            <form id="formContato">

                <input
                type="text"
                id="nome"
                placeholder="Seu nome">

                <input
                type="email"
                id="email"
                placeholder="Seu email">

                <textarea
                id="mensagem"
                placeholder="Digite sua mensagem">
                </textarea>

                <button
                type="button"
                class="btn"
                onclick="enviarFormulario()">

                    Enviar Mensagem

                </button>

            </form>

        </div>

    </section>

    <!-- FOOTER -->

    <footer>

        <p>
            © 2026 EcoFuture
        </p>

    </footer>

    <script src="js/contato.js"></script>

</body>
</html>
